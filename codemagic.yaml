workflows:
  cpc-academy-android-debug:
    name: CPC Academy Android APK
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: v22.11.0
      java: 21
    scripts:
      - name: Install JavaScript dependencies
        script: npm install

      - name: Type check
        script: npm run typecheck

      - name: Build static Next.js app
        script: npm run build

      - name: Install Android SDK packages
        script: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Capacitor Android project
        script: npx cap add android

      - name: Sync app into Android project
        script: npx cap sync android

      - name: Configure Android SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build installable debug APK
        script: |
          cd "$CM_BUILD_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
      - android/app/build/outputs/**/*.apk
