name: CPC Academy Runner Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/runner-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke-test:
    name: Verify GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm runner started
        run: |
          echo "GitHub-hosted runner started successfully."
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
