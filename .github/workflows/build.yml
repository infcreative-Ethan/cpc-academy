name: Build CPC Academy Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpc-academy-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Build static web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets into Android app
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk CPC-Academy-v0.1.0-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CPC-Academy-Android-APK
          path: CPC-Academy-v0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 30
