name: Build CPC Academy Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpc-academy-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Set up Python for vocabulary and audio assets
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build offline English-Chinese dictionary
        run: python scripts/build-offline-dictionary.py

      - name: Enrich bilingual medical vocabulary
        run: python scripts/enrich-chinese.py

      - name: Build official FY2027 ICD-10-CM offline lookup
        run: python scripts/build-icd10cm-reference.py

      - name: Validate 22 medical chapters, 100 coding lessons, 228 cases and mock exam
        run: node scripts/validate-cpc-content.cjs

      - name: Type check
        run: npm run typecheck

      - name: Export static web app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Cache Piper model and generated MP3 assets
        uses: actions/cache@v4
        with:
          path: |
            .piper
            out/audio
          key: cpc-audio-en-us-kristin-${{ hashFiles('lib/book-vocabulary.json', 'lib/words.ts', 'scripts/generate-audio.py') }}

      - name: Install FFmpeg for MP3 encoding
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Verify medical pronunciation overrides
        run: python scripts/test-pronunciation.py

      - name: Generate offline US English MP3 library
        run: |
          python -m pip install --disable-pip-version-check piper-tts==1.4.2
          python -m piper.download_voices en_US-kristin-medium --data-dir .piper
          python scripts/generate-audio.py --model .piper/en_US-kristin-medium.onnx --output-dir out/audio

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync web assets into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPC-Academy-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CPC-Academy.apk
          TAG="v1.0.0-beta.${{ github.run_number }}"
          TITLE="CPC Academy V1.0 Beta — Build #${{ github.run_number }}"
          NOTES="CPC Learning Center beta. Includes the existing medical vocabulary and audio study tools, 22-chapter textbook navigator, anatomy learning map, simulated clinical documentation cases, coding-set foundations, and offline dictionary. Educational use only; verify real coding against current official references."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CPC-Academy.apk --clobber
          else
            gh release create "$TAG" CPC-Academy.apk --title "$TITLE" --notes "$NOTES" --prerelease
          fi
